<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Roster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">SR</div><span class="t">Smart Roster</span></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="btn burger" id="burger" aria-label="Menu">☰</button>
      <button class="btn" id="collapse" title="Collapse sidebar" aria-label="Collapse sidebar">⇔</button>
      <input class="search" id="gsearch" placeholder="Search employees or brands…" aria-label="Global search">
      <div class="grow"></div>
      <label class="small muted" for="month">Month</label>
      <input type="month" id="month" aria-label="Select month">
      <button class="btn primary" id="gen">⚡ Generate Roster</button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<script src="/static/app.js"></script>
</body>
</html>
